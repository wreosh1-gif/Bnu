<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO & Search Engine Optimization -->
    <title>نبض الكرة | KoraPulse - أخبار، أهداف، وملخصات المباريات</title>
    <meta name="description" content="منصة نبض الكرة KoraPulse لتغطية أحدث الأخبار الرياضية العاجلة، ملخصات الأهداف، نتائج وجداول المباريات اليومية أولاً بأول.">
    <meta name="keywords" content="نبض الكرة, KoraPulse, أهداف اليوم, ملخصات المباريات, أخبار الرياضة, جدول المباريات, الدوري الإنجليزي, دوري أبطال أوروبا">
    <meta name="robots" content="index, follow">
    <meta name="author" content="نبض الكرة - KoraPulse">
    <link rel="canonical" href="./">

    <!-- Open Graph / Facebook / Twitter Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="نبض الكرة | KoraPulse - أخبار وملخصات المباريات">
    <meta property="og:description" content="تغطية حية وفورية لأحدث ملخصات الأهداف والأخبار الرياضية العاجلة.">
    <meta property="og:image" content="mg.png">
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="نبض الكرة | KoraPulse">
    <meta property="twitter:description" content="تغطية سريعة للأهداف والملخصات اليومية.">
    <meta property="twitter:image" content="mg.png">

    <!-- Icons & Assets -->
    <link rel="icon" type="image/png" href="cover.png">
    <link rel="apple-touch-icon" href="cover.png">

    <!-- Tailwind CSS CDN & Cairo Font -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Schema.org SEO Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SportsNewsArticle",
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "./"
      },
      "headline": "نبض الكرة | KoraPulse - تغطية إخبارية وملخصات رياضية",
      "image": ["mg.png"],
      "publisher": {
        "@type": "Organization",
        "name": "نبض الكرة",
        "logo": {
          "@type": "ImageObject",
          "url": "cover.png"
        }
      }
    }
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0B131F',
                            card: '#131F33',
                            accent: '#00E5FF',
                            pulse: '#10B981',
                            gold: '#F59E0B'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0B131F; color: #E2E8F0; }
        .pulse-glow { box-shadow: 0 0 20px rgba(0, 229, 255, 0.25); }
    </style>
</head>
<body class="bg-brand-dark min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-brand-card/90 backdrop-blur-md border-b border-cyan-500/20 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="cover.png" alt="نبض الكرة Logo" class="w-10 h-10 rounded-full border border-cyan-400 object-cover pulse-glow" onerror="this.src='https://via.placeholder.com/40'">
                <div>
                    <h1 class="text-xl font-black text-white leading-none">نبض <span class="text-cyan-400">الكرة</span></h1>
                    <span class="text-xs text-gray-400 tracking-wider">KoraPulse | @KoraPulse</span>
                </div>
            </div>

            <a href="https://twitter.com/KoraPulse" target="_blank" class="bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-2">
                <i class="fa-brands fa-x-twitter"></i>
                <span class="hidden sm:inline">تابعنا على X</span>
            </a>
        </div>
    </header>

    <!-- Adsterra Banner Area -->
    <div class="max-w-6xl mx-auto px-4 mt-4 w-full">
        <div onclick="openAdAndAction()" class="cursor-pointer bg-gradient-to-r from-cyan-900/40 via-brand-card to-emerald-900/40 border border-cyan-500/30 rounded-xl p-3 text-center transition hover:border-cyan-400 shadow-lg">
            <span class="bg-cyan-500/20 text-cyan-300 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider mb-1 inline-block">إعلان مُموَّل</span>
            <p class="text-sm font-bold text-white">🔥 اضغط هنا لمشاهدة ملخصات اليوم وتحديثات المباريات حصرياً</p>
        </div>
    </div>

    <!-- Main Dynamic Content -->
    <main class="max-w-6xl mx-auto px-4 py-6 w-full flex-grow space-y-8">

        <!-- Dynamic Posts Grid -->
        <section>
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-newspaper text-cyan-400"></i> أحدث الأخبار والملخصات
                </h2>
                <span class="text-xs text-gray-400">تحديث أوتوماتيكي</span>
            </div>

            <!-- Container for JS Dynamic Injection -->
            <div id="posts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Data will load here dynamically from type1.js, type2.js ... -->
            </div>

            <!-- Fallback Loader / No Content Message -->
            <div id="loading-msg" class="text-center py-10 text-gray-500">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl text-cyan-400 mb-2"></i>
                <p>جاري تحميل الأخبار والملخصات...</p>
            </div>
        </section>

        <!-- Big CTA Button -->
        <div class="text-center my-8">
            <button onclick="openAdAndAction()" class="bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-400 hover:to-emerald-400 text-brand-dark font-black text-lg px-8 py-4 rounded-xl shadow-lg transition transform hover:-translate-y-1 w-full sm:w-auto">
                <i class="fa-solid fa-circle-play ml-2"></i> اضغط هنا لمشاهدة كافة الملخصات والنتائج مباشرة
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-brand-card border-t border-gray-800 py-6 mt-8">
        <div class="max-w-6xl mx-auto px-4 text-center text-xs text-gray-500 space-y-2">
            <p>جميع الحقوق محفوظة &copy; 2026 - موقع <span class="text-cyan-400 font-bold">نبض الكرة | KoraPulse</span></p>
        </div>
    </footer>

    <!-- Adsterra & Dynamic File Loader Logic -->
    <script>
        const ADSTERRA_LINK = "https://www.profitableratecpmnetwork.com/k6m3s1kj?key=384085d471ecea82da753956b7c3440b";
        window.koraPosts = [];

        // Function to trigger Adsterra and optionally execute callback
        function openAdAndAction(callbackUrl) {
            window.open(ADSTERRA_LINK, '_blank');
            if (callbackUrl) {
                setTimeout(() => {
                    window.location.href = callbackUrl;
                }, 300);
            }
        }

        // Render Posts to DOM
        function renderPosts() {
            const container = document.getElementById('posts-container');
            const loader = document.getElementById('loading-msg');
            
            if (window.koraPosts.length === 0) {
                loader.innerHTML = '<p class="text-gray-400">لا توجد أحدث الأخبار حالياً.</p>';
                return;
            }

            loader.style.display = 'none';
            container.innerHTML = '';

            window.koraPosts.forEach(post => {
                const card = document.createElement('div');
                card.className = "bg-brand-card rounded-xl border border-gray-800 hover:border-cyan-500/50 transition overflow-hidden cursor-pointer group flex flex-col justify-between";
                card.onclick = () => openAdAndAction(post.link || null);

                card.innerHTML = `
                    <div>
                        <div class="relative bg-gray-900 h-48 overflow-hidden">
                            <img src="${post.image || 'mg.png'}" alt="${post.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <div class="absolute inset-0 bg-gradient-to-t from-brand-card to-transparent"></div>
                            ${post.type === 'video' ? '<div class="absolute inset-0 flex items-center justify-center"><i class="fa-solid fa-play text-4xl text-cyan-400"></i></div>' : ''}
                            <span class="absolute top-2 right-2 bg-cyan-500 text-black text-xs font-bold px-2 py-0.5 rounded">${post.badge || 'جديد'}</span>
                        </div>
                        <div class="p-4">
                            <span class="text-xs text-emerald-400 font-bold">${post.category || 'أخبار'}</span>
                            <h3 class="font-bold text-white text-base mt-1 group-hover:text-cyan-400 transition line-clamp-2">${post.title}</h3>
                            <p class="text-xs text-gray-400 mt-2 line-clamp-2">${post.description || ''}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0 flex items-center justify-between border-t border-gray-800/50 mt-3">
                        <span class="text-[11px] text-gray-500"><i class="fa-regular fa-clock ml-1"></i> ${post.time || 'الآن'}</span>
                        <button class="bg-cyan-500/10 group-hover:bg-cyan-500 group-hover:text-black text-cyan-400 border border-cyan-500/30 text-xs font-bold px-3 py-1.5 rounded-lg transition">
                            ${post.buttonText || 'مشاهدة / قراءة'}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Auto Load Script Files (type1.js, type2.js, type3.js...) Until NotFound
        let scriptIndex = 1;
        function loadNextScript() {
            const script = document.createElement('script');
            script.src = `type${scriptIndex}.js`;
            
            script.onload = function() {
                scriptIndex++;
                loadNextScript(); // Load next file (type2.js, type3.js...)
            };

            script.onerror = function() {
                // Stopped when no more typeX.js files are found
                renderPosts();
            };

            document.body.appendChild(script);
        }

        // Start loading scripts on load
        window.addEventListener('DOMContentLoaded', loadNextScript);
    </script>
</body>
</html>
